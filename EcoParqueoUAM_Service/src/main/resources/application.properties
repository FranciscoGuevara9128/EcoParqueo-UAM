spring.application.name=EcoParqueoUAM_Service
server.port=8181
server.servlet.context-path=/api

#Documentation
springdoc.swagger-ui.path=/swagger-ui.html

# Database configuration
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecoparqueo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate dialect for PostgreSQL to avoid "Unable to determine Dialect" when JDBC URL is missing
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect